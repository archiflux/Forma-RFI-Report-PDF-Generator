<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Siteboard mark: Holdpoint's diamond outline (same geometry, corners
       clipped by the viewBox), with a 2x2 board of tiles in the centre; the
       top tile is citron. -->
  <rect x="4" y="4" width="16" height="16" transform="rotate(45 12 12)" fill="none" stroke="#006881" stroke-width="3"/>
  <g transform="rotate(45 12 12)">
    <rect x="8.2" y="8.2" width="3.4" height="3.4" fill="#d1c800"/>
    <rect x="12.4" y="8.2" width="3.4" height="3.4" fill="#006881"/>
    <rect x="8.2" y="12.4" width="3.4" height="3.4" fill="#006881"/>
    <rect x="12.4" y="12.4" width="3.4" height="3.4" fill="#006881"/>
  </g>
</svg>
